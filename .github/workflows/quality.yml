name: Repository integrity
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: SHA256 integrity of tracked research files
        run: python scripts/verify_manifest.py
      - name: Compile preserved experiment scripts
        run: python -m compileall -q experiments scripts tests
      - name: Validate research index links
        run: python scripts/check_repository.py
      - name: Reconcile headline statistics with aggregate CSVs
        run: python scripts/reconcile_metrics.py
      - name: Validate release-bundle verifier against synthetic fixtures
        run: python -m unittest discover -s tests -p "test_release_bundle.py" -v
